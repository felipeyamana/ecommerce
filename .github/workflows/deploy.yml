name: Build and deploy ECommerce

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  DOTNET_VERSION: 10.0.x
  NODE_VERSION: 22.x
  SOLUTION_PATH: ECommerce.slnx
  PROJECT_PATH: server/ECommerce.Api/ECommerce.Api.csproj
  CLIENT_PATH: client
  CLIENT_DIST_PATH: client/dist/ecommerce-web/browser
  PUBLISH_DIR: ${{ github.workspace }}/publish
  PACKAGE_PATH: ${{ github.workspace }}/ecommerce.zip

concurrency:
  group: ecommerce-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build package
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: ECommerce_CI_123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'ECommerce_CI_123!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.CLIENT_PATH }}/package-lock.json

      - name: Restore backend
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build backend
        run: dotnet build ${{ env.SOLUTION_PATH }} --configuration Release --no-restore

      - name: Test backend
        env:
          ECOMMERCE_TEST_CONNECTION_STRING: Server=localhost,1433;Database={database};User Id=sa;Password=ECommerce_CI_123!;TrustServerCertificate=True;Pooling=False
        run: dotnet test ${{ env.SOLUTION_PATH }} --configuration Release --no-build --no-restore --verbosity normal

      - name: Install frontend dependencies
        working-directory: ${{ env.CLIENT_PATH }}
        run: npm ci

      - name: Test frontend
        working-directory: ${{ env.CLIENT_PATH }}
        run: npm test -- --watch=false

      - name: Build frontend
        working-directory: ${{ env.CLIENT_PATH }}
        run: npm run build -- --configuration production

      - name: Publish backend
        run: dotnet publish ${{ env.PROJECT_PATH }} --configuration Release --no-build --no-restore --output ${{ env.PUBLISH_DIR }}

      - name: Add frontend to publish package
        run: |
          mkdir -p "${{ env.PUBLISH_DIR }}/wwwroot"
          cp -R "${{ env.CLIENT_DIST_PATH }}/." "${{ env.PUBLISH_DIR }}/wwwroot/"

      - name: Package app
        run: |
          cd "${{ env.PUBLISH_DIR }}"
          zip -r "${{ env.PACKAGE_PATH }}" .

      - name: Generate EF migration script
        env:
          ConnectionStrings__DefaultConnection: Server=localhost,1433;Database=ECommerceMigrationBuild;User Id=sa;Password=ECommerce_CI_123!;TrustServerCertificate=True
        run: |
          dotnet tool install --tool-path ./.tools dotnet-ef --version 10.0.*
          ./.tools/dotnet-ef migrations script --idempotent --no-build \
            --project ${{ env.PROJECT_PATH }} \
            --startup-project ${{ env.PROJECT_PATH }} \
            --configuration Release \
            --output "${{ github.workspace }}/ef-migrations.sql"

      - name: Upload app package
        uses: actions/upload-artifact@v7
        with:
          name: ecommerce-package
          path: ${{ env.PACKAGE_PATH }}
          if-no-files-found: error

      - name: Upload migration script
        uses: actions/upload-artifact@v7
        with:
          name: ecommerce-ef-migrations
          path: ${{ github.workspace }}/ef-migrations.sql
          if-no-files-found: error

  deploy:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: production
      url: https://${{ vars.AZURE_WEBAPP_NAME }}.azurewebsites.net

    steps:
      - name: Download app package
        uses: actions/download-artifact@v8
        with:
          name: ecommerce-package

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy app package
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ecommerce.zip
