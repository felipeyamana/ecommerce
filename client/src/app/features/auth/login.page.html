<main class="auth-shell"><section class="auth-card" aria-labelledby="auth-title">
  <header><p class="eyebrow">ECommerce</p><h1 id="auth-title">{{ mode() === 'login' ? 'Welcome back' : 'Create your account' }}</h1><p>{{ mode() === 'login' ? 'Sign in to continue.' : 'Register to get started.' }}</p></header>
  <div class="tabs" role="tablist"><button type="button" [class.active]="mode() === 'login'" (click)="mode.set('login'); error.set('')">Sign in</button><button type="button" [class.active]="mode() === 'register'" (click)="mode.set('register'); error.set('')">Register</button></div>
  @if (error()) { <p class="error" role="alert">{{ error() }}</p> }
  @if (mode() === 'login') {
    <form [formGroup]="loginForm" (ngSubmit)="submitLogin()"><label>Email<input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" /></label><label>Password<input type="password" formControlName="password" autocomplete="current-password" /></label><label class="checkbox"><input type="checkbox" formControlName="rememberMe" /> Keep me signed in</label><button class="submit" type="submit" [disabled]="busy()">{{ busy() ? 'Signing in…' : 'Sign in' }}</button></form>
  } @else {
    <form [formGroup]="registerForm" (ngSubmit)="submitRegistration()"><label>Email<input type="email" formControlName="email" autocomplete="email" placeholder="you@example.com" /></label><label>Password<input type="password" formControlName="password" autocomplete="new-password" /><small>At least 8 characters.</small></label><label>Confirm password<input type="password" formControlName="confirmPassword" autocomplete="new-password" /></label><button class="submit" type="submit" [disabled]="busy()">{{ busy() ? 'Creating account…' : 'Create account' }}</button></form>
  }
</section></main>
