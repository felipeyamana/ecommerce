<header class="sticky top-0 z-10 border-b border-slate-200 bg-white/90 backdrop-blur-xl">
  <nav
    class="mx-auto flex min-h-18 w-[min(calc(100%-1rem),75rem)] items-center justify-between sm:w-[min(calc(100%-2rem),75rem)]"
    aria-label="Primary navigation"
  >
    <a
      class="text-xl font-extrabold tracking-tight text-slate-900 no-underline"
      routerLink="/"
      aria-label="ECommerce home"
    >
      ECommerce
    </a>

    <div class="flex items-center gap-2.5">
      @if (auth.isAuthenticated()) {
        <a class="rounded-xl px-3 py-2.5 text-sm font-bold text-blue-700 no-underline hover:bg-blue-50" routerLink="/cart">
          Cart@if (cart.totalQuantity() > 0) { ({{ cart.totalQuantity() }}) }
        </a>
        <span class="hidden text-sm text-slate-600 sm:inline">{{ auth.currentUser()?.email }}</span>
        <button
          class="rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm font-bold text-slate-700 transition hover:border-slate-400 hover:bg-slate-100 disabled:opacity-60 sm:px-4"
          type="button"
          [disabled]="loggingOut()"
          (click)="logout()"
        >
          {{ loggingOut() ? 'Logging out…' : 'Log out' }}
        </button>
      } @else if (auth.initialized()) {
      <a
        class="rounded-xl border border-slate-300 bg-white px-3 py-2.5 text-sm font-bold text-slate-700 no-underline transition hover:border-slate-400 hover:bg-slate-100 sm:px-4"
        routerLink="/login"
        routerLinkActive="border-slate-400 bg-slate-100"
      >
        Log in
      </a>
      <a
        class="rounded-xl bg-blue-700 px-3 py-2.5 text-sm font-bold text-white no-underline transition hover:bg-blue-800 sm:px-4"
        routerLink="/register"
        routerLinkActive="bg-blue-800"
      >
        Sign up
      </a>
      }
    </div>
  </nav>
</header>

<router-outlet />
